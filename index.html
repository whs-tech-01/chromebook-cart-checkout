<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromebook Cart Checkout</title>
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rye&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #03462b;
      --green-dark: #022e1c;
      --green-tint: #e7f0eb;
      --gold: #f9c906;
      --gold-soft: #fff6cc;
      --ink: #14211a;
      --muted: #55655c;
      --line: #c9d6ce;
      --bg: #f6f8f4;
      --card: #ffffff;
      --error: #a61b1b;
      --error-bg: #fdecec;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Sans 3", system-ui, sans-serif;
      font-size: 17px;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      background: var(--green);
      border-bottom: 6px solid var(--gold);
      color: #fff;
      padding: 20px 16px;
    }
    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 18px;
    }
    header img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
      padding: 4px;
      flex-shrink: 0;
    }
    header h1 {
      font-family: "Rye", Georgia, serif;
      font-weight: 400;
      color: var(--gold);
      margin: 0;
      font-size: clamp(1.5rem, 4vw, 2.3rem);
      line-height: 1.1;
    }
    header p { margin: 6px 0 0; opacity: .9; }

    main {
      max-width: 960px;
      margin: 28px auto 48px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-top: 5px solid var(--green);
      border-radius: 10px;
      padding: 22px;
    }
    .card h2 {
      margin: 0 0 16px;
      color: var(--green);
      font-size: 1.3rem;
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    @media (max-width: 480px) { .row { grid-template-columns: 1fr; } }

    label { display: block; font-weight: 600; margin: 0 0 6px; }
    .optional { font-weight: 400; color: var(--muted); }
    .field { margin-bottom: 16px; }
    input, select, textarea {
      width: 100%;
      font: inherit;
      color: var(--ink);
      padding: 10px 12px;
      border: 1.5px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }
    textarea { min-height: 80px; resize: vertical; }
    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 1px;
      border-color: var(--green);
    }
    .hp { position: absolute; left: -9999px; }

    button {
      width: 100%;
      font: inherit;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--gold);
      color: var(--green-dark);
      cursor: pointer;
      box-shadow: 0 3px 0 #c79f00;
    }
    button:hover { background: #ffd51f; }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #c79f00; }
    button[disabled] { opacity: .6; cursor: wait; }

    .msg {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 7px;
      font-weight: 600;
    }
    .msg.show { display: block; }
    .msg.ok { background: var(--green-tint); color: var(--green); border-left: 5px solid var(--green); }
    .msg.err { background: var(--error-bg); color: var(--error); border-left: 5px solid var(--error); }

    #availability .hint { color: var(--muted); margin: 0; }
    .cart-block { margin-bottom: 14px; }
    .cart-block h3 {
      margin: 0 0 6px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pill {
      font-size: .78rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .pill.free { background: var(--green-tint); color: var(--green); }
    .pill.busy { background: var(--gold-soft); color: #6b5600; }
    .cart-block ul { margin: 0; padding-left: 18px; color: var(--muted); }
    .cart-block.selected h3 { color: var(--green); }
    .cart-block.selected h3::before { content: "▸"; color: var(--gold); }

    footer { text-align: center; color: var(--muted); font-size: .9rem; padding-bottom: 32px; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <img src="assets/logo.jpg" alt="Vikings Pride logo">
      <div>
        <h1>Chromebook Cart Checkout</h1>
        <p>Reserve a cart for your class. Your booking goes straight onto the shared calendar.</p>
      </div>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>Request a cart</h2>
      <form id="form" novalidate>
        <div class="row">
          <div class="field">
            <label for="name">Your name</label>
            <input id="name" name="name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">School email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="room">Room number</label>
            <input id="room" name="room" required>
          </div>
          <div class="field">
            <label for="cart">Cart</label>
            <select id="cart" name="cart" required></select>
          </div>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input id="date" name="date" type="date" required>
        </div>
        <div class="row">
          <div class="field">
            <label for="start">Start time</label>
            <select id="start" name="start" required></select>
          </div>
          <div class="field">
            <label for="end">End time</label>
            <select id="end" name="end" required></select>
          </div>
        </div>
        <div class="field">
          <label for="students">Number of students <span class="optional">(optional)</span></label>
          <input id="students" name="students" type="number" min="1" max="60" inputmode="numeric">
        </div>
        <div class="field">
          <label for="notes">Notes <span class="optional">(optional)</span></label>
          <textarea id="notes" name="notes" placeholder="Class, activity, anything the tech team should know"></textarea>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <button id="submit" type="submit">Reserve cart</button>
        <div id="msg" class="msg" role="status" aria-live="polite"></div>
      </form>
    </section>

    <aside class="card" id="availability">
      <h2>Availability</h2>
      <div id="avail-body"><p class="hint">Pick a date to see which carts are already booked.</p></div>
    </aside>
  </main>

  <footer>Questions? Contact the tech office.</footer>

  <script src="config.js"></script>
  <script>
    const cfg = window.CART_CONFIG;
    const $ = (id) => document.getElementById(id);
    const form = $("form");
    const msg = $("msg");
    let bookings = null;

    // Remember name/email/room on this device so returning teachers don't retype.
    const remembered = ["name", "email", "room"];
    remembered.forEach((k) => {
      try { const v = localStorage.getItem("cart-" + k); if (v) $(k).value = v; } catch (e) {}
    });

    // Carts
    $("cart").innerHTML = '<option value="">Choose a cart…</option>' +
      cfg.carts.map((c) => `<option>${escapeHtml(c)}</option>`).join("");

    // Times in 15-minute steps
    const toMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
    const toHHMM = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
    const toLabel = (m) => {
      const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, "0");
      return `${((h + 11) % 12) + 1}:${mm} ${h < 12 ? "AM" : "PM"}`;
    };
    const opts = [];
    for (let m = toMin(cfg.dayStart); m <= toMin(cfg.dayEnd); m += 15) opts.push(m);
    $("start").innerHTML = opts.slice(0, -1).map((m) => `<option value="${toHHMM(m)}">${toLabel(m)}</option>`).join("");
    function fillEnd() {
      const s = toMin($("start").value);
      const prev = $("end").value;
      $("end").innerHTML = opts.filter((m) => m > s).map((m) => `<option value="${toHHMM(m)}">${toLabel(m)}</option>`).join("");
      if (prev && toMin(prev) > s) $("end").value = prev;
      else $("end").value = toHHMM(Math.min(s + 60, toMin(cfg.dayEnd)));
    }
    $("start").addEventListener("change", fillEnd);
    fillEnd();

    // Default date: today (local), no past dates
    const today = new Date();
    const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    $("date").min = iso(today);
    $("date").value = iso(today);

    const configured = cfg.scriptUrl && !cfg.scriptUrl.startsWith("PASTE");

    async function loadAvailability() {
      const date = $("date").value;
      const body = $("avail-body");
      if (!date) return;
      if (!configured) {
        body.innerHTML = '<p class="hint">Not connected yet: add your Web app URL to config.js.</p>';
        return;
      }
      bookings = null;
      body.innerHTML = '<p class="hint">Loading…</p>';
      try {
        const res = await fetch(`${cfg.scriptUrl}?date=${encodeURIComponent(date)}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error);
        bookings = data.bookings;
        renderAvailability();
      } catch (e) {
        bookings = null;
        body.innerHTML = '<p class="hint">Couldn\'t load availability. You can still submit a request.</p>';
      }
    }

    function renderAvailability() {
      const sel = $("cart").value;
      $("avail-body").innerHTML = cfg.carts.map((c) => {
        const list = bookings.filter((b) => b.cart === c);
        const pill = list.length
          ? `<span class="pill busy">${list.length} booking${list.length > 1 ? "s" : ""}</span>`
          : '<span class="pill free">Open all day</span>';
        const items = list.map((b) => `<li>${b.start}–${b.end} · ${escapeHtml(b.teacher)}</li>`).join("");
        return `<div class="cart-block${c === sel ? " selected" : ""}"><h3>${escapeHtml(c)} ${pill}</h3>${items ? `<ul>${items}</ul>` : ""}</div>`;
      }).join("");
    }

    $("date").addEventListener("change", loadAvailability);
    $("cart").addEventListener("change", () => { if (bookings) renderAvailability(); });
    loadAvailability();

    function show(text, ok) {
      msg.textContent = text;
      msg.className = "msg show " + (ok ? "ok" : "err");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      const missing = ["name", "email", "room", "cart", "date", "start", "end"].find((k) => !data[k].trim());
      if (missing) { show("Please fill in every required field.", false); $(missing).focus(); return; }
      if (!configured) { show("This form isn't connected yet. Add the Web app URL to config.js.", false); return; }

      $("submit").disabled = true;
      $("submit").textContent = "Reserving…";
      try {
        // text/plain avoids a CORS preflight, which Apps Script doesn't support.
        const res = await fetch(cfg.scriptUrl, { method: "POST", body: JSON.stringify(data) });
        const out = await res.json();
        if (!out.ok) throw new Error(out.error || "Something went wrong.");
        remembered.forEach((k) => { try { localStorage.setItem("cart-" + k, data[k]); } catch (err) {} });
        show(`You're booked! ${data.cart} on ${data.date}, ${toLabel(toMin(data.start))}–${toLabel(toMin(data.end))}. Check your email for the calendar invite.`, true);
        $("notes").value = "";
        $("students").value = "";
        loadAvailability();
      } catch (err) {
        show(err.message || "Couldn't reach the calendar. Please try again.", false);
      } finally {
        $("submit").disabled = false;
        $("submit").textContent = "Reserve cart";
      }
    });

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
  </script>
</body>
</html>
